name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv pip install -r requirements_test.txt
      - run: uv run --no-project ruff check custom_components tests tools --select E,F,W,B,UP,SIM,I --ignore E501,SIM108,UP040
      - run: uv run --no-project pytest -q
