blueprint:
  name: BlueBattery – Vorheizen
  description: >
    Heizt vor: zu einem Datum und einer Uhrzeit, auf Wunsch zusätzlich per Knopf oder
    nach einem wöchentlichen Zeitplan. Die Heizung geht auf die Zieltemperatur und bleibt
    dort. Mit einem Nachlauf in Stunden schaltet sie nach Erreichen der Zieltemperatur
    nach dieser Zeit wieder aus. Liegt der Zeitpunkt in der Vergangenheit oder weniger als
    15 Minuten voraus, erscheint beim Speichern eine Meldung in Home Assistant.
    Es sind keine Helfer nötig.

    Pre-heats at a date and time (optionally also by button or weekly schedule). The heater
    goes to the target temperature and stays there; with an after-run in hours it switches off
    that long after the target is reached. No helpers needed.
  domain: automation
  author: sahomm
  source_url: https://github.com/sahomm/BlueBattery/blob/main/blueprints/automation/bluebattery/vorheizen.yaml
  input:
    heating:
      name: Heizung
      icon: mdi:radiator
      input:
        climate_entity:
          name: Heizung
          selector:
            entity:
              filter:
                - domain: climate
        target_temperature:
          name: Zieltemperatur
          default: 20
          selector:
            number:
              min: 10
              max: 25
              step: 1
              unit_of_measurement: °C
        afterrun_hours:
          name: Nachlauf nach Erreichen der Zieltemperatur
          default: 0
          selector:
            number:
              min: 0
              max: 24
              step: 0.5
              unit_of_measurement: h
        preset:
          name: Heizstufe (optional)
          description: z. B. `eco` oder `high` (Truma). Leer lassen für die zuletzt genutzte Stufe.
          default: ""
          selector:
            text: {}
    start:
      name: Wann vorheizen?
      icon: mdi:clock-start
      input:
        start_at:
          name: Starten am
          default: ""
          selector:
            datetime: {}
        button_entity:
          name: Knopf „Jetzt vorheizen“ (optional)
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: input_button
        schedule_entity:
          name: Wöchentlicher Zeitplan (optional)
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: schedule

mode: restart

trigger_variables:
  start_at: !input start_at

variables:
  climate_entity: !input climate_entity
  target_temperature: !input target_temperature
  afterrun_hours: !input afterrun_hours
  preset: !input preset
  start_ts: "{{ as_timestamp(start_at) if start_at | string != '' else 0 }}"

triggers:
  - trigger: template
    value_template: "{{ start_at | string != '' and now().timestamp() >= as_timestamp(start_at) }}"
    id: timed
  - trigger: state
    entity_id: !input button_entity
    not_to:
      - unavailable
      - unknown
    id: button
  - trigger: state
    entity_id: !input schedule_entity
    to: "on"
    id: schedule
  - trigger: event
    event_type: automation_reloaded
    id: check

conditions:
  - condition: or
    conditions:
      - condition: not
        conditions:
          - condition: trigger
            id: check
      - condition: template
        value_template: "{{ this.attributes.current | int(0) == 0 }}"

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: check
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ start_ts | float(0) > 0
                         and start_ts | float(0) < now().timestamp() + 900
                         and (this.attributes.last_triggered is none
                              or as_timestamp(this.attributes.last_triggered) < start_ts | float(0)) }}
                sequence:
                  - action: persistent_notification.create
                    data:
                      notification_id: "vorheizen_{{ this.entity_id }}"
                      title: Vorheizen
                      message: >-
                        Der eingestellte Zeitpunkt liegt in der Vergangenheit oder weniger als
                        15 Minuten voraus. Bitte unter „Starten am“ einen späteren Zeitpunkt wählen.
    default:
      - action: climate.set_temperature
        target:
          entity_id: "{{ climate_entity }}"
        data:
          temperature: "{{ target_temperature }}"
          hvac_mode: heat
      - if:
          - condition: template
            value_template: "{{ preset != '' }}"
        then:
          - delay:
              seconds: 3
          - action: climate.set_preset_mode
            target:
              entity_id: "{{ climate_entity }}"
            data:
              preset_mode: "{{ preset }}"
          - wait_template: "{{ is_state_attr(climate_entity, 'preset_mode', preset) }}"
            timeout:
              seconds: 15
            continue_on_timeout: true
          - if:
              - condition: template
                value_template: "{{ not is_state_attr(climate_entity, 'preset_mode', preset) }}"
            then:
              - action: climate.set_preset_mode
                target:
                  entity_id: "{{ climate_entity }}"
                data:
                  preset_mode: "{{ preset }}"
      - if:
          - condition: template
            value_template: "{{ afterrun_hours | float(0) > 0 }}"
        then:
          - wait_template: >-
              {{ state_attr(climate_entity, 'current_temperature') | float(0)
                 >= target_temperature | float(0) }}
            timeout:
              hours: 12
            continue_on_timeout: false
          - delay:
              seconds: "{{ (afterrun_hours | float(0) * 3600) | int(0) }}"
          - action: climate.turn_off
            target:
              entity_id: "{{ climate_entity }}"
