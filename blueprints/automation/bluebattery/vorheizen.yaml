blueprint:
  name: BlueBattery – Vorheizen
  description: >
    Heizt vor – einmalig zu einem Zeitpunkt (z. B. morgen um 13 Uhr), sofort per
    Knopf oder wöchentlich nach Zeitplan. Zeitpunkt und Knopf: Heizung an und nach
    der eingestellten Dauer wieder aus (Dauer 0 = bleibt an). Zeitplan: Heizung zu
    Beginn des Zeitfensters an, am Ende aus.

    Vorher die gewünschten Helfer anlegen (Einstellungen → Geräte & Dienste → Helfer):
    „Datum und/oder Uhrzeit“ (mit Datum und Uhrzeit), „Taste“ und/oder „Zeitplan“.

    Pre-heats once at a date/time, instantly via a button, or weekly on a schedule.
  domain: automation
  author: sahomm
  source_url: https://github.com/sahomm/BlueBattery/blob/main/blueprints/automation/bluebattery/vorheizen.yaml
  input:
    heating:
      name: Heizung
      icon: mdi:radiator
      input:
        climate_entity:
          name: Heizung
          selector:
            entity:
              filter:
                - domain: climate
        target_temperature:
          name: Zieltemperatur
          default: 20
          selector:
            number:
              min: 5
              max: 30
              step: 1
              unit_of_measurement: °C
        preset:
          name: Heizstufe (optional)
          description: z. B. `eco` oder `high` (Truma). Leer lassen für die zuletzt genutzte Stufe.
          default: ""
          selector:
            text: {}
        heat_duration:
          name: Heizdauer (Zeitpunkt und Knopf)
          description: 0 = Heizung bleibt an.
          default:
            hours: 2
          selector:
            duration: {}
    start:
      name: Wann vorheizen?
      icon: mdi:clock-start
      input:
        start_datetime:
          name: Einmalig zu Datum und Uhrzeit (optional)
          description: Helfer „Datum und/oder Uhrzeit“ mit Datum und Uhrzeit.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: input_datetime
        button_entity:
          name: Knopf „Jetzt vorheizen“ (optional)
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: input_button
        schedule_entity:
          name: Wöchentlicher Zeitplan (optional)
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: schedule

mode: restart

variables:
  climate_entity: !input climate_entity
  target_temperature: !input target_temperature
  preset: !input preset
  heat_duration: !input heat_duration
  heat_seconds: >-
    {{ (heat_duration.hours | default(0)) * 3600 + (heat_duration.minutes | default(0)) * 60
       + (heat_duration.seconds | default(0)) }}

triggers:
  - trigger: time
    at: !input start_datetime
    id: timed
  - trigger: state
    entity_id: !input button_entity
    not_to:
      - unavailable
      - unknown
    id: button
  - trigger: state
    entity_id: !input schedule_entity
    to: "on"
    id: schedule_on
  - trigger: state
    entity_id: !input schedule_entity
    from: "on"
    to: "off"
    id: schedule_off

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: schedule_off
        sequence:
          - action: climate.turn_off
            target:
              entity_id: "{{ climate_entity }}"
    default:
      - action: climate.set_temperature
        target:
          entity_id: "{{ climate_entity }}"
        data:
          temperature: "{{ target_temperature }}"
          hvac_mode: heat
      - if:
          - condition: template
            value_template: "{{ preset != '' }}"
        then:
          - delay:
              seconds: 3
          - action: climate.set_preset_mode
            target:
              entity_id: "{{ climate_entity }}"
            data:
              preset_mode: "{{ preset }}"
      - if:
          - condition: trigger
            id:
              - timed
              - button
          - condition: template
            value_template: "{{ heat_seconds | int(0) > 0 }}"
        then:
          - delay: "{{ heat_seconds | int(0) }}"
          - action: climate.turn_off
            target:
              entity_id: "{{ climate_entity }}"
